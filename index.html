<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daniela Paneva — Front-End Developer</title>
    <meta
      name="description"
      content="Portfolio of Daniela Paneva, an interactive front-end developer in Sofia, Bulgaria, working in WebGL and creative interfaces." />
  </head>
  <body>
    {{> frame }}

    <!-- The front door: the shell and the field, nothing else. Every other view
         is its own page now, so this one holds no content of its own.

         Only #swup is swapped between pages; the canvas above it persists, which
         is what keeps the shader running across a navigation. -->
    <main id="swup" class="view" data-page="top" data-view="home"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
