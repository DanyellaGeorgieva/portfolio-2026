<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Contact — Daniela Paneva</title>
    <meta
      name="description"
      content="Get in touch with Daniela Paneva about creative front-end and WebGL work." />
  </head>
  <body>
    {{> frame }}

    <main id="swup" class="view" data-page="top" data-view="contact">
      <section class="section" id="contact">
        <h1 class="page__title">
          Got something interesting to build? Let’s talk.
        </h1>
        <!-- <p class="page__lead">I also always love to chat about technology, feel free to get in touch if you think we may share a common interest</p> -->

        <!-- One channel per item: a question, then the way to act on it. -->
        <div class="contact">
          <div class="contact__item">
            <h2 class="page__heading">Email is the quickest way to reach me.</h2>
            <a class="contact__link" href="mailto:daniela@panev.net">
              <svg class="chevron" viewBox="0 0 6 10" width="6" height="10" aria-hidden="true" focusable="false">
                <path d="M1 1l4 4-4 4" />
              </svg><span>daniela@panev.net</span>
            </a>
          </div>

          <div class="contact__item">
            <h2 class="page__heading">Rather keep it professional?</h2>
            <a class="contact__link" href="https://www.linkedin.com/in/danyella-georgieva/" target="_blank" rel="noopener">
              <svg class="chevron" viewBox="0 0 6 10" width="6" height="10" aria-hidden="true" focusable="false">
                <path d="M1 1l4 4-4 4" />
              </svg><span>LinkedIn</span>
            </a>
          </div>

          <div class="contact__item">
            <h2 class="page__heading">Curious what I’m making lately?</h2>
            <a class="contact__link" href="https://www.instagram.com/danyella.xyz" target="_blank" rel="noopener">
              <svg class="chevron" viewBox="0 0 6 10" width="6" height="10" aria-hidden="true" focusable="false">
                <path d="M1 1l4 4-4 4" />
              </svg><span>Instagram</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
