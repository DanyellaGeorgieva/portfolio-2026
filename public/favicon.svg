<!-- The site's eye as a favicon. The open state of #icon-eye-still in
     src/partials/frame.html, copied exactly — retune one, retune the other.

     Two changes for 16px: the viewBox is squared around the eye (centred on the
     iris at 18.1212, 22), and the stroke is heavier, because 2 units of a 44-unit
     drawing is under a pixel at tab size and the lashes vanish. The colour can't
     be currentColor here — a favicon renders in isolation — so it is the site's
     first-paint ink, lifted to a pale lavender on dark browser chrome. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.94 0 44.12 44.12">
  <style>
    g { color: #180e34; }
    @media (prefers-color-scheme: dark) { g { color: #d8d2ec; } }
  </style>
