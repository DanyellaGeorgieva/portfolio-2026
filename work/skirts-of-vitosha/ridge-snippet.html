<!-- ============================================================
     Vitosha ridge — scrolling silhouette
     Paste anywhere. Needs the two contour SVGs on your server.
     No libraries, no WebGL. ~4 KB.

     Colour: it fills with the element's own `color`, so style it
     however you like — a class, an inline style, a CSS variable,
     dark-mode rules. currentColor is the only colour it knows.
     ============================================================ -->

<div class="ridge"
     data-ridge
     data-top="/assets/vitosha-top_D.svg"
     data-bottom="/assets/vitosha-bottom_D.svg"
     data-speed="0.012"
     data-amount="0.85"
     data-across="0.32"
     data-start="0.6"
     aria-hidden="true">
  <canvas></canvas>
  <span class="ridge__hint">Drag to move</span>
</div>

<style>
  .ridge {
    /* THE COLOUR OF THE SHAPE — change this and nothing else */
    color: #111;

    position: relative;
    width: 100%;
    height: clamp(160px, 26vw, 320px);
    display: block;
  }
  .ridge__hint {          /* delete if you don't want it */
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.55;
    pointer-events: none;
  }
  .ridge canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: pan-y;          /* sideways drags us, up/down scrolls the page */
    user-select: none;
    -webkit-user-select: none;
  }
  .ridge.is-dragging canvas { cursor: grabbing; }

  /* e.g. flip it for dark mode */
  @media (prefers-color-scheme: dark) {
    .ridge { color: #F2F2F0; }
  }
</style>

<script>
(() => {
  const el = document.querySelector("[data-ridge]");
  if (!el) return;
  const canvas = el.querySelector("canvas");
  const ctx = canvas.getContext("2d");

  const LIST = 1024;                       // heights per contour
  const SPEED = +el.dataset.speed || 0.012;  // panoramas drifting past per second
  const AMOUNT = +el.dataset.amount || 0.85; // how tall the ridge stands
  // How much of the panorama fits across the width. 0.32 is the site's own
  // framing: a third of the range at a time, so the peaks stay big. Raise it
  // to fit more mountain in, lower it to get closer.
  const ACROSS = +el.dataset.across || 0.32;
  // Where along the range to open. 0.6 puts the tallest summit in view.
  const START = el.dataset.start === undefined ? 0.6 : +el.dataset.start;
  const BAND = 0.55;                        // band height, share of the canvas
  const DROP = -0.25;                       // how the lower edge answers
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- measure an SVG into a list of heights ------------------------
     Column by column, top down, to the first pixel of the line. Then the
     two ends are eased together so the list repeats, and each value is
     averaged with its neighbours to take out the whole-pixel steps. */
  async function measure(url) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = url;
    await img.decode();

    const w = LIST;
    const h = Math.max(Math.round((w * img.naturalHeight) / img.naturalWidth), 16);
    const c = Object.assign(document.createElement("canvas"), { width: w, height: h });
    const cx = c.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0, w, h);
    const px = cx.getImageData(0, 0, w, h).data;

    const heights = new Float32Array(w);
    for (let x = 0; x < w; x++) {
      let top = h;
      for (let y = 0; y < h; y++) {
        if (px[(y * w + x) * 4 + 3] > 20) { top = y; break; }
      }
      heights[x] = 1 - top / h;
    }

    // make the ends agree, so it can loop for ever
    const ends = Math.floor(w * 0.08);
    const target = (heights[0] + heights[w - 1]) / 2;
    for (let i = 0; i < ends; i++) {
      const t = i / ends;
      const ease = t * t * (3 - 2 * t);
      heights[i] = target * (1 - ease) + heights[i] * ease;
      const j = w - 1 - i;
      heights[j] = target * (1 - ease) + heights[j] * ease;
    }

    // average with the immediate neighbours
    const smooth = Float32Array.from(heights);
    for (let x = 0; x < w; x++) {
      const a = heights[(x - 1 + w) % w];
      const b = heights[x];
      const c2 = heights[(x + 1) % w];
      smooth[x] = (a + b + c2) / 3;
    }
    return smooth;
  }

  /* ---- draw one frame ---------------------------------------------- */
  let top = null;
  let bottom = null;
  let offset = START;
  let w = 0;
  let h = 0;

  const at = (list, u) => {
    const f = (((u % 1) + 1) % 1) * (LIST - 1);
    const i = Math.floor(f);
    const k = f - i;
    return list[i] * (1 - k) + list[(i + 1) % LIST] * k;
  };

  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = el.clientWidth;
    h = el.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw() {
    if (!top || !bottom || !w || !h) return;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = getComputedStyle(el).color;   // <- your colour
    const band = h * BAND;
    const middle = h * 0.56;
    const step = 2;                                // px between samples

    ctx.beginPath();
    for (let x = 0; x <= w; x += step) {
      const u = (x / w) * ACROSS + offset;
      const y = middle - band / 2 - (at(top, u) - 0.5) * AMOUNT * band;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    for (let x = w; x >= 0; x -= step) {
      const u = (x / w) * ACROSS + offset;
      const y = middle + band / 2 - (at(bottom, u) - 0.5) * DROP * band;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  /* ---- drag to move -------------------------------------------------- */
  let dragging = false;
  let dragX = 0;
  let taken = false;   // once dragged, the drift hands over to the reader

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    taken = true;
    dragX = e.clientX;
    el.classList.add("is-dragging");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragX;
    dragX = e.clientX;
    offset -= (dx / w) * ACROSS;   // a full width is ACROSS panoramas
    draw();
  });
  const release = () => { dragging = false; el.classList.remove("is-dragging"); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  /* ---- run ---------------------------------------------------------- */
  let playing = true;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last);
    last = now;
    if (playing && !still && !taken) {
      offset += (SPEED * dt) / 1000;
      draw();
    }
    requestAnimationFrame(frame);
  }

  new ResizeObserver(() => { size(); draw(); }).observe(el);
  new IntersectionObserver(([e]) => { playing = e.isIntersecting; }).observe(el);
  // The fill is read from CSS on every draw, so a colour change lands by itself
  // while it is moving. These two cover the cases where it is standing still.
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
  window.vitoshaRidge = { repaint: draw };  // call after your own theme toggle

  Promise.all([measure(el.dataset.top), measure(el.dataset.bottom)])
    .then(([t, b]) => {
      top = t;
      bottom = b;
      size();
      draw();
      requestAnimationFrame(frame);
    })
    .catch(() => { el.hidden = true; });
})();
</script>
