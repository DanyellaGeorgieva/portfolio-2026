<!-- ============================================================
     Vitosha cloth — solid colour, drag to move
     The same shape as the case-study artifact: the project's own
     vertex shader bending a real mesh, with the woven fabric
     replaced by a flat fill in your colour.

     Host the two contour SVGs and point data-top / data-bottom at
     them (same origin — the script reads their pixels).
     three.js loads from a CDN, only when the element is in view.
     ============================================================ -->

<div class="cloth"
     data-cloth
     data-top="/assets/vitosha-top_D.svg"
     data-bottom="/assets/vitosha-bottom_D.svg"
     data-speed="0.012"
     data-start="0.6"
     aria-hidden="true">
  <canvas></canvas>
  <span class="cloth__hint">Drag to move</span>
</div>

<style>
  .cloth {
    /* THE COLOUR OF THE SHAPE — change this and nothing else */
    color: #16233B;

    position: relative;
    display: block;
    width: 100%;
    height: clamp(200px, 32vw, 420px);
  }
  .cloth canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: pan-y;        /* sideways drags the cloth, up/down scrolls */
    user-select: none;
    -webkit-user-select: none;
  }
  .cloth.is-dragging canvas { cursor: grabbing; }
  .cloth__hint {                /* delete if you don't want it */
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.5;
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .cloth { color: #E7EDF1; }
  }
</style>

<script>
(() => {
  const el = document.querySelector("[data-cloth]");
  if (!el) return;
  const canvas = el.querySelector("canvas");

  const THREE_SRC = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js";
  const LIST = 1024;
  const SPEED = +el.dataset.speed || 0.012;   // panoramas drifting past per second
  const START = el.dataset.start === undefined ? 0.6 : +el.dataset.start;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The site's own framing and amplitudes (distortConfig / DISTORT_PROFILES).
  const TOP_MAX = 0.85;        // how far the ridge rises
  const BOTTOM_MAX = -0.25;    // how the hem answers
  const BAND = 0.55;           // cloth height, share of the view
  const DROP = -0.12;          // how far down the cloth hangs
  const WIDE = 2;              // how wide the contour is drawn (panoramaScale)
  const MASK_END = 0.79;       // where the shaping eases off toward the right
  const MASK_FALLOFF = 0.2;
  const IMAGE_ASPECT = 2049 / 319;

  /* ---- measure an SVG into a list of heights ------------------------
     Column by column, top down, to the first pixel of the line; then the
     ends are eased together so it repeats, and each value is averaged
     with its neighbours to take out the whole-pixel steps. */
  async function measure(url) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = url;
    await img.decode();

    const w = LIST;
    const h = Math.max(Math.round((w * img.naturalHeight) / img.naturalWidth), 16);
    const c = Object.assign(document.createElement("canvas"), { width: w, height: h });
    const cx = c.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0, w, h);
    const px = cx.getImageData(0, 0, w, h).data;

    const heights = new Float32Array(w);
    for (let x = 0; x < w; x++) {
      let top = h;
      for (let y = 0; y < h; y++) {
        if (px[(y * w + x) * 4 + 3] > 20) { top = y; break; }
      }
      heights[x] = 1 - top / h;
    }

    const ends = Math.floor(w * 0.08);
    const target = (heights[0] + heights[w - 1]) / 2;
    for (let i = 0; i < ends; i++) {
      const t = i / ends;
      const ease = t * t * (3 - 2 * t);
      heights[i] = target * (1 - ease) + heights[i] * ease;
      const j = w - 1 - i;
      heights[j] = target * (1 - ease) + heights[j] * ease;
    }

    const bytes = new Uint8Array(w * 4);
    for (let x = 0; x < w; x++) {
      const a = heights[(x - 1 + w) % w];
      const b = heights[x];
      const c2 = heights[(x + 1) % w];
      const v = Math.floor(((a + b + c2) / 3) * 255);
      bytes[x * 4] = bytes[x * 4 + 1] = bytes[x * 4 + 2] = v;
      bytes[x * 4 + 3] = 255;
    }
    return bytes;
  }

  /* ---- the shaders --------------------------------------------------
     The vertex shader is the project's own file: each column of the mesh
     looks up its height and moves. The fragment shader is the only part
     that differs from the site — a flat fill instead of the textile. */
  const VERT = `
    varying vec2 vUv;
    uniform sampler2D uHeightmap;
    uniform sampler2D uHeightmapBottom;
    uniform float uAmpTop;
    uniform float uAmpBottom;
    uniform highp float uScrollOffset;
    uniform mediump float uMaskEnd;
    uniform mediump float uMaskFalloff;
    uniform mediump float uTileCount;

    void main() {
      vUv = uv;
      vec3 pos = position;
      float sampleX = uv.x * uTileCount + uScrollOffset;
      float hTop = texture2D(uHeightmap, vec2(sampleX, 0.5)).r - 0.5;
      float hBottom = texture2D(uHeightmapBottom, vec2(sampleX, 0.5)).r - 0.5;
      float mask = 1.0 - smoothstep(uMaskEnd - uMaskFalloff, uMaskEnd, uv.x);
      pos.y += mix(hBottom * uAmpBottom, hTop * uAmpTop, uv.y) * mask;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;
  const FRAG = `
    precision mediump float;
    varying vec2 vUv;
    uniform vec3 uColor;
    void main() { gl_FragColor = vec4(uColor, 1.0); }
  `;

  /* ---- build the scene ---------------------------------------------- */
  let renderer, scene, camera, mesh, uniforms;
  let offset = START;
  let playing = true;
  let taken = false;

  function build(topBytes, bottomBytes) {
    const heightTex = (bytes) => {
      const t = new THREE.DataTexture(bytes, LIST, 1, THREE.RGBAFormat);
      t.minFilter = t.magFilter = THREE.LinearFilter;
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.ClampToEdgeWrapping;
      t.generateMipmaps = false;
      t.needsUpdate = true;
      return t;
    };

    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, depth: false, stencil: false });
    renderer.setClearAlpha(0);                      // your page shows through
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
    camera.position.set(0, 0, 0.7);
    scene.add(camera);

    uniforms = {
      uHeightmap: { value: heightTex(topBytes) },
      uHeightmapBottom: { value: heightTex(bottomBytes) },
      uScrollOffset: { value: offset },
      uAmpTop: { value: TOP_MAX },
      uAmpBottom: { value: BOTTOM_MAX },
      uMaskEnd: { value: MASK_END },
      uMaskFalloff: { value: MASK_FALLOFF },
      uTileCount: { value: 1 },
      uColor: { value: new THREE.Color(1, 1, 1) },
    };
    mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(IMAGE_ASPECT, 1, 384, 96),   // the grid of points
      new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: FRAG, uniforms, depthTest: false, depthWrite: false }),
    );
    scene.add(mesh);

    resize();
    new ResizeObserver(resize).observe(el);
    new IntersectionObserver(([e]) => { playing = e.isIntersecting; }).observe(el);
    requestAnimationFrame(frame);
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, el.clientWidth);
    const h = Math.max(1, el.clientHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    // fit the cloth to the view, exactly as the site does
    const viewH = 2 * Math.tan((camera.fov * Math.PI) / 360) * camera.position.z;
    const viewW = viewH * camera.aspect;
    const clothH = viewH * BAND;
    mesh.scale.set(viewW / IMAGE_ASPECT, clothH, 1);
    mesh.position.y = viewH * DROP;
    uniforms.uTileCount.value = viewW / (clothH * IMAGE_ASPECT) / WIDE;
    render();
  }

  let cssColor = "";
  function render() {
    if (!renderer) return;
    const c = getComputedStyle(el).color;          // <- your colour
    if (c !== cssColor) {
      cssColor = c;
      const m = c.match(/-?[\d.]+/g) || [0, 0, 0];
      // written straight to the screen, so it needs no colour conversion:
      // what you set in CSS is what you get
      uniforms.uColor.value.setRGB(+m[0] / 255, +m[1] / 255, +m[2] / 255);
    }
    uniforms.uScrollOffset.value = offset;
    renderer.render(scene, camera);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last);
    last = now;
    if (playing) {
      if (!still && !taken) offset += (SPEED * dt) / 1000;
      render();
    }
    requestAnimationFrame(frame);
  }

  /* ---- drag to move --------------------------------------------------- */
  let dragging = false;
  let dragX = 0;
  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    taken = true;
    dragX = e.clientX;
    el.classList.add("is-dragging");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging || !uniforms) return;
    const dx = e.clientX - dragX;
    dragX = e.clientX;
    offset -= (dx / el.clientWidth) * uniforms.uTileCount.value;
    render();
  });
  const release = () => { dragging = false; el.classList.remove("is-dragging"); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  window.vitoshaCloth = { repaint: render };   // call after your own theme toggle

  /* ---- start ---------------------------------------------------------- */
  const loadThree = () =>
    window.THREE
      ? Promise.resolve()
      : new Promise((res, rej) => {
          const s = document.createElement("script");
          s.src = THREE_SRC;
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });

  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    Promise.all([loadThree(), measure(el.dataset.top), measure(el.dataset.bottom)])
      .then(([, top, bottom]) => build(top, bottom))
      .catch(() => { el.hidden = true; });
  };

  const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { io.disconnect(); start(); } },
                                      { rootMargin: "300px" });
  io.observe(el);
  setTimeout(start, 2000);   // fallback, in case it never scrolls into view
})();
</script>
