     (and its live WebGL context) survives navigation. -->

<!-- Palette picker — filled by main.js from paletteNames, so the order on screen
     is the palette sequence itself. Lives in the shell rather than in the page
     so it survives a swup swap; hidden on detail pages by the rule above. -->
<div class="picker" id="picker" hidden></div>
